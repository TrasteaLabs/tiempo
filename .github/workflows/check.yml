# El check del proyecto en cada push y pull request (022). Sin secretos y con permisos de solo lectura: corre igual
# para un pull request de un fork. Acciones fijadas por hash (el comentario dice la versión).
name: check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El versionCode es el número de commits: con un clonado superficial saldría 1.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: check
        run: ./gradlew :buildSrc:test lintDebug testDebugUnitTest --console=plain
      - name: Informes si falla
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes-check
          path: |
            app/build/reports/
            buildSrc/build/reports/
          retention-days: 7
